[project]
name = "metaharness"
version = "0.2.0.dev0"
description = "Meta-Harness v2 — local-first control plane for heterogeneous AI agents"
readme = "README-v2.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "websockets>=12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/daemon/metaharness"]

[tool.hatch.build.targets.sdist]
include = ["apps/daemon/metaharness", "README-v2.md", "LICENSE"]

[tool.uv]
package = true
