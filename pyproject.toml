[project]
name = "metaharness"
version = "0.2.0.dev0"
description = "Meta-Harness v2 — local-first control plane for heterogeneous AI agents"
readme = "README-v2.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "platformdirs>=4.2",
    "httpx>=0.27",
    "websockets>=12",
    "psutil>=5.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/daemon/metaharness", "packages/contracts/metaharness_contracts"]

[tool.hatch.build.targets.sdist]
include = ["apps/daemon/metaharness", "packages/contracts", "README-v2.md", "LICENSE"]

[tool.uv]
package = true

# Point the language server at the project virtualenv. Without this, Pyright reports
# "metaharness_contracts could not be resolved" for modules that run perfectly under
# `uv run` -- a false alarm that trains people to ignore the editor.
[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["apps/daemon", "packages/contracts", "tests", "scripts"]
exclude = ["**/__pycache__", "apps/web/node_modules"]

[dependency-groups]
dev = [
    "playwright>=1.63.0",
]
