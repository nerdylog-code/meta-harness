name: ci

# Superseded the original Linux-only job (which ran `pip install pyyaml` +
# `python tests/run_all.py`) with a two-OS matrix: the same frozen v1 suite now
# runs on Windows as well, its PyYAML dependency comes from `uv sync`, and the
# v2 suites run beside it. BOOK §68: no merge with Windows red.

on: [push, pull_request, workflow_dispatch]

jobs:
  core:
    name: core (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: sync dependencies
        run: uv sync --frozen

      - name: doctor (informational)
        continue-on-error: true
        run: uv run python scripts/doctor.py

      - name: v1 regression suite (frozen MVP)
        run: uv run python scripts/test.py --suite v1

      - name: v2 unit suite
        run: uv run python scripts/test.py --suite unit

      - name: shared contracts + Python/TypeScript parity
        run: uv run python scripts/test.py --suite contracts

      - name: typecheck the generated TypeScript contracts
        run: npx --yes typescript@5.6.3 tsc -p packages/contracts/ts/tsconfig.json

      - name: v2 integration suite (real server + websockets)
        run: uv run python scripts/test.py --suite integration

  web:
    name: web
    runs-on: ubuntu-latest
    # No job-level guard here on purpose: `hashFiles` is not available in
    # `jobs.<job_id>.if` (it needs the workspace, which does not exist yet at
    # that point), and a workflow file using it fails validation before any job
    # runs. `apps/web/package.json` is part of the repo since WP-002, so a
    # missing web app is a real regression and should fail loudly.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/web
        run: pnpm run typecheck
      - name: build
        working-directory: apps/web
        run: pnpm run build
