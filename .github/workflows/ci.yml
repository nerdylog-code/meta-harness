name: ci

# Superseded the original Linux-only job (which ran `pip install pyyaml` +
# `python tests/run_all.py`) with a two-OS matrix: the same frozen v1 suite now
# runs on Windows as well, its PyYAML dependency comes from `uv sync`, and the
# v2 suites run beside it. BOOK §68: no merge with Windows red.

on: [push, pull_request, workflow_dispatch]

jobs:
  core:
    name: core (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: sync dependencies
        run: uv sync --frozen

      - name: doctor (informational)
        run: uv run python scripts/doctor.py --report-only

      - name: v1 regression suite (frozen MVP)
        run: uv run python scripts/test.py --suite v1

      - name: v2 unit suite
        run: uv run python scripts/test.py --suite unit

      - name: shared contracts + Python/TypeScript parity
        run: uv run python scripts/test.py --suite contracts

      - name: canonical store suite (WP-004 A1/A2/A5/A6/A8)
        run: uv run python scripts/test.py --suite store

      - name: replay, crash and reconciliation suite (WP-004 A3/A4/A7/A9)
        run: uv run python scripts/test.py --suite replay

      - name: typecheck the generated TypeScript contracts
        run: npx --yes -p typescript@5.6.3 tsc -p packages/contracts/ts/tsconfig.json

      - name: v2 integration suite (real server + websockets)
        run: uv run python scripts/test.py --suite integration

      # The Pi adapter against the wire format captured from the real binary. It needs no
      # binary, no provider and no credit, so it runs on both OSes -- which is how the
      # transport lifecycle, the parser and the protocol contract stay verified on Windows.
      - name: runtime conformance suite (Pi adapter, captured wire format)
        run: uv run python scripts/test.py --suite conformance

  desktop-rust:
    name: desktop-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - name: install stable Rust
        uses: dtolnay/rust-toolchain@stable
      - name: cargo check
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml

  web:
    name: web
    runs-on: ubuntu-latest
    # No job-level guard here on purpose: `hashFiles` is not available in
    # `jobs.<job_id>.if` (it needs the workspace, which does not exist yet at
    # that point), and a workflow file using it fails validation before any job
    # runs. `apps/web/package.json` is part of the repo since WP-002, so a
    # missing web app is a real regression and should fail loudly.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - name: install
        working-directory: apps/web
        run: pnpm install --frozen-lockfile
      - name: typecheck
        working-directory: apps/web
        run: pnpm run typecheck
      - name: build
        working-directory: apps/web
        run: pnpm run build
