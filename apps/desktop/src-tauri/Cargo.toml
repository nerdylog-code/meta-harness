[package]
name = "metaharness-desktop"
version = "0.2.0"
edition = "2021"
description = "Meta-Harness desktop shell: a window that starts the daemon and loads its UI"
rust-version = "1.77"
publish = false

# The shell is deliberately thin: it spawns the Python host (which owns the daemon lifecycle
# through WP-005's supervisor), reads one JSON status line, and navigates the webview. There is
# no HTTP client, no process-tree code and no domain type in here, because a second
# implementation of the daemon's lifecycle in Rust is exactly what WP-007 forbids.
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
