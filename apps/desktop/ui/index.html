<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Meta-Harness</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        height: 100vh;
        display: grid;
        place-items: center;
        background: #0d1014;
        color: #d7dee8;
        font: 14px/1.6 ui-sans-serif, system-ui, sans-serif;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1rem; letter-spacing: 0.14em; text-transform: uppercase; margin: 0 0 0.75rem; }
      p { color: #8b98a8; margin: 0.4rem 0; }
      code { font-family: ui-monospace, monospace; color: #d7dee8; }
      .pulse { display: inline-block; width: 0.5rem; height: 0.5rem; border-radius: 50%;
               background: #5aa9e6; margin-right: 0.5rem; animation: p 1.4s ease-in-out infinite; }
      @keyframes p { 0%, 100% { opacity: 0.25 } 50% { opacity: 1 } }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="pulse"></span>Meta-Harness</h1>
      <p id="line">Starting the daemon on 127.0.0.1…</p>
      <p>This page is replaced by the control plane as soon as the daemon answers <code>/health</code>. If it does not, the reason and the log path appear here instead of an empty window.</p>
    </main>
  </body>
</html>
